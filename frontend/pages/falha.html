<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Problema no Pagamento - Conecta Joias</title>
  
  <!-- Favicon e Ícones -->
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/favicon.png">
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #151515 0%, #050505 100%);
      padding: 1.5rem;
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .falha-container {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid rgba(225, 112, 85, 0.3);
      border-radius: var(--radius-lg);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
      padding: 2.5rem 2rem;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    .failure-icon-badge {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(225, 112, 85, 0.15);
      border: 3px solid #ff7675;
      color: #ff7675;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 25px rgba(255, 118, 117, 0.25);
      animation: shake 0.5s ease-out;
    }

    .falha-title {
      font-family: var(--font-title);
      color: #ff7675;
      font-size: 1.8rem;
      margin: 0 0 0.8rem 0;
    }

    .falha-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .actions-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .btn-retry {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--gold-gradient);
      color: var(--text-dark);
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-retry:hover {
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }

    .btn-outline-cancel {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .btn-outline-cancel:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="falha-container">
    <div class="failure-icon-badge">
      <i class="fa-solid fa-circle-exclamation"></i>
    </div>
    
    <h1 class="falha-title">Pagamento Não Concluído</h1>
    <p class="falha-subtitle">
      Ops! Ocorreu um problema com o seu pagamento. Não se preocupe, nenhuma cobrança foi efetuada.
    </p>

    <div class="actions-group">
      <a href="pagamento.html" class="btn-retry">
        <i class="fa-solid fa-rotate-right"></i> Tentar Novamente
      </a>
      <a href="manager.html" class="btn-outline-cancel">
        <i class="fa-solid fa-house"></i> Voltar ao Painel
      </a>
    </div>
  </div>

</body>
</html>

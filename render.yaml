services:
  - type: web
    name: projconectajoias
    runtime: node
    plan: free
    buildCommand: cd server && npm install && npx prisma generate
    startCommand: cd server && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://projconectajoias.onrender.com
      - key: PUBLIC_URL
        value: https://projconectajoias.onrender.com
      - key: MP_ACCESS_TOKEN
        sync: false
